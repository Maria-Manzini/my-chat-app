name: Java CI with Automatic Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-java@v3
      with:
        java-version: '11'
    - run: |
        mkdir -p lib
        wget -O lib/testng.jar https://repo1.maven.org/maven2/org/testng/testng/7.4.0/testng-7.4.0.jar
    - run: javac -cp "lib/*" -d . my/chatapp/*.java
    - run: java -cp ".:lib/*" org.testng.TestNG testng.xml